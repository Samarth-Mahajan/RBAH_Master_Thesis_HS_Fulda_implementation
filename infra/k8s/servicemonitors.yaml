  name: rbah-pricing
  namespace: rbah
  labels: { release: monitoring }
spec:
  namespaceSelector: { matchNames: [rbah] }
  selector: { matchLabels: { app: pricing } }
  endpoints: [{ port: http, path: /metrics, interval: 5s }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rbah-inventory
  namespace: rbah
  labels: { release: monitoring }
spec:
  namespaceSelector: { matchNames: [rbah] }
  selector: { matchLabels: { app: inventory } }
  endpoints: [{ port: http, path: /metrics, interval: 5s }]
