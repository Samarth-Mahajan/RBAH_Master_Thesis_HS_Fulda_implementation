apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rbah-services
  namespace: rbah
  labels: { release: monitoring }
spec:
  namespaceSelector: { matchNames: [rbah] }
  selector: { matchLabels: { app: order } }
  endpoints: [{ port: http, path: /metrics, interval: 5s }]
---
apiVersion: monitoring.coreos.com/v1
