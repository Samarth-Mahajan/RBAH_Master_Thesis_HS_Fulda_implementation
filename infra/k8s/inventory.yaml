apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: rbah
  labels: { app: inventory }
spec:
  replicas: 2
  selector: { matchLabels: { app: inventory } }
  template:
    metadata:
      labels: { app: inventory }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: inventory
          image: rbah-inventory:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: grpc, containerPort: 50053 }
            - { name: http, containerPort: 8080 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: rbah
  labels: { app: inventory }
spec:
  selector: { app: inventory }
  ports:
    - { name: grpc, port: 50053, targetPort: grpc }
    - { name: http, port: 8080, targetPort: http }
